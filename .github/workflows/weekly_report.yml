name: Weekly Channel Status & Audit Report

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Weekly Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          export PYTHONPATH="automation/pipeline:$PYTHONPATH"
          python automation/pipeline/weekly_reporter.py

      - name: Commit Weekly Report
        run: |
          git config user.name "WhereMyDollarGo Bot"
          git config user.email "bot@users.noreply.github.com"
          git add weekly-report.md
          git commit -m "docs: update weekly-report.md [skip ci]" || echo "No changes to commit"
          git push origin main
