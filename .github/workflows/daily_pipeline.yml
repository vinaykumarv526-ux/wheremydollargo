name: WhereMyDollarGo Daily Autonomous Production Pipeline

on:
  schedule:
    # Runs in cloud at 11:00 UTC (7:00 AM ET) and 21:00 UTC (5:00 PM ET)
    # Staging & scheduling directly ahead of US Midday (12:30 PM ET) and Prime Evening (6:30 PM ET) peaks
    - cron: '0 11,21 * * *'
  workflow_dispatch:
    inputs:
      slots_to_generate:
        description: 'Number of slots to generate in this run'
        required: false
        default: '1'

permissions:
  contents: write
  issues: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts pillow google-auth-oauthlib google-api-python-client

      - name: Run Buffer Scheduler & Daily Content Pipeline (Peak Timing)
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PYTHONPATH="automation:automation/pipeline:$PYTHONPATH"
          COUNT="${{ github.event.inputs.slots_to_generate || '1' }}"
          python automation/pipeline/buffer_scheduler.py "$COUNT"

      - name: Commit & Push Generated Content & State
        run: |
          git config user.name "WhereMyDollarGo Bot"
          git config user.email "bot@users.noreply.github.com"
          git add publish-queue/ automation/pipeline/state.json styles-used.md sources.md
          git commit -m "chore(pipeline): automated US peak content generation [skip ci]" || echo "No changes to commit"
          git push origin main
