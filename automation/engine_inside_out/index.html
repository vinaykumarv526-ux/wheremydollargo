<!doctype html>
<html><head><meta charset="utf-8"><title>2D Flat Architectural Explainer</title>
<style>
@font-face { font-family: 'Inter'; font-weight: 900; src: url('fonts/Inter-Black.otf') format('opentype'); }
html, body { margin: 0; background: #0E1A2B; height: 100%; overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; }
canvas { display: block; height: 100vh; width: auto; max-width: 100vw; object-fit: contain; }
body.capture canvas { height: auto; width: auto; }
#play { position: fixed; font: 900 28px Inter, sans-serif; padding: 18px 36px; border: 0; border-radius: 40px; background: #FFD43B; color: #1A1A1E; cursor: pointer; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
</style></head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<button id="play" hidden>▶ PLAY</button>
<script>if (location.search.includes('capture')) document.body.className = 'capture';</script>
<script type="module" src="src/main.js"></script>
</body></html>
